<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mary Feito à Mão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Peças feitas à mão em João Pessoa - PB, com envio para todo o Brasil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:wght@500;700&display=swap">
<style>
/* Layout: uma coluna simples no meio da tela, só a logo, uma frase e dois botões. Sem enfeites. */
:root{
  --fundo:#f8efe6;     /* creme da logo */
  --cacau:#5e3824;     /* marrom do nome "Mary" */
  --texto:#7a5541;     /* texto de apoio */
  --linha:#d9c2b0;     /* contorno suave */
  --serif:'Lora', Georgia, serif;
  --body:'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; background:var(--fundo); color:var(--cacau); font:500 16px/1.55 var(--body); -webkit-font-smoothing:antialiased}
.pagina{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
  max-width:400px; margin:0 auto; text-align:center;
  padding-block:48px 40px;
  padding-left:max(20px, env(safe-area-inset-left, 0px));
  padding-right:max(20px, env(safe-area-inset-right, 0px));
}
.logo{width:200px; height:200px; border-radius:50%; overflow:hidden; border:1px solid var(--linha)}
.logo img{width:100%; height:100%; object-fit:cover; display:block}
.texto{display:flex; flex-direction:column; gap:6px}
h1{font-family:var(--serif); font-weight:600; font-size:24px; line-height:1.3; margin:0; text-wrap:balance}
.texto p{margin:0; color:var(--texto); font-size:16px}
.links{width:100%; display:flex; flex-direction:column; gap:12px}
.btn{
  display:flex; align-items:center; gap:14px; width:100%; min-height:80px; padding:13px 16px 13px 13px;
  border-radius:20px; text-decoration:none; text-align:left; border:1.5px solid transparent;
  transition:transform .15s ease;
}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--linha); outline-offset:3px}
.btn .ic{width:54px; height:54px; flex:none; border-radius:15px; display:grid; place-items:center}
.btn .ic svg{width:26px; height:26px}
.btn .tx{flex:1; min-width:0; line-height:1.25}
.btn b{display:block; font-size:18px; font-weight:700}
.btn small{display:block; font-size:14px; margin-top:3px}
.btn .seta{width:22px; height:22px; flex:none}
.cheio{background:var(--cacau); color:#fff; box-shadow:0 12px 26px -14px rgba(94,56,36,.7)}
.cheio .ic{background:rgba(255,255,255,.16)}
.cheio small{color:#ecd9cb}
.vazio{background:#fffaf5; color:var(--cacau); border-color:var(--linha)}
.vazio .ic{background:#f3e5d9; color:#2f7a4a}
.vazio small{color:var(--texto)}
@media (hover:hover){ .btn:hover{transform:translateY(-2px)} }
.rodape{font-size:14px; color:var(--texto); margin:0}
</style>
